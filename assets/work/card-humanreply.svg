<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="500" viewBox="60 80 520 250" role="img" aria-label="HumanReply AI — IA que reescreve conversas no tom certo"><title>HumanReply AI — IA que reescreve conversas no tom certo</title><style>@font-face{font-family:'M';src:url(data:font/woff2;base64,) format('woff2');}
@font-face{font-family:'R';src:url(data:font/woff2;base64,) format('woff2');}
text{font-kerning:normal}
.fb{transform-box:fill-box;transform-origin:center}
.fl{transform-box:fill-box;transform-origin:left center}
@keyframes b1{0%,3.75%{opacity:0;transform:translateY(10px)} 11.25%,88.75%{opacity:1;transform:translateY(0)} 95.00%,100%{opacity:0;transform:translateY(0)}}.b1{animation:b1 8.0s cubic-bezier(.16,1,.3,1) infinite}
@keyframes an{0%,15.00%{opacity:0} 20.00%,32.50%{opacity:1} 36.25%,100%{opacity:0}}.an{animation:an 8.0s ease infinite}
@keyframes bob{0%,60%,100%{transform:translateY(0);opacity:.35} 30%{transform:translateY(-4px);opacity:1}}.bob{animation:bob 1s ease-in-out infinite}
@keyframes b2{0%,35.00%{opacity:0;transform:translateY(10px)} 42.50%,88.75%{opacity:1;transform:translateY(0)} 95.00%,100%{opacity:0;transform:translateY(0)}}.b2{animation:b2 8.0s cubic-bezier(.16,1,.3,1) infinite}
@keyframes b3{0%,45.00%{opacity:0;transform:translateY(10px)} 52.50%,88.75%{opacity:1;transform:translateY(0)} 95.00%,100%{opacity:0;transform:translateY(0)}}.b3{animation:b3 8.0s cubic-bezier(.16,1,.3,1) infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs></defs><g class="b1"><rect x="104" y="92" width="306.3" height="40" rx="20" fill="none" stroke="#353535"/><text x="122.0" y="116.5" font-family="R,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#cfcfcf" text-anchor="start">Quero cancelar. O atendimento foi péssimo.</text></g><g class="an"><circle class="bob" style="animation-delay:0.0s" cx="118" cy="160" r="3" fill="#fff"/><circle class="bob" style="animation-delay:0.15s" cx="129" cy="160" r="3" fill="#fff"/><circle class="bob" style="animation-delay:0.3s" cx="140" cy="160" r="3" fill="#fff"/><text x="160.0" y="164.0" font-family="M,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="start" letter-spacing="2.2">ANALISANDO TOM  ·  FRUSTRAÇÃO 82%</text></g><g class="b2"><rect x="274.3" y="184" width="261.7" height="62" rx="20" fill="#fff"/><text x="294.3" y="210.0" font-family="R,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#000" text-anchor="start">Sinto muito pela experiência.</text><text x="294.3" y="229.0" font-family="R,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#000" text-anchor="start">Já estou resolvendo isso para você.</text></g><g class="b3"><text x="536.0" y="272.0" font-family="M,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="9.5" fill="#8c8c8c" text-anchor="end" letter-spacing="2.2">TOM: EMPÁTICO   ·   CONTEXTO: RETENÇÃO</text></g></svg>